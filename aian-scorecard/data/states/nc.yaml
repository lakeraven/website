  data_first:
    mark: unpublished
    quote: Collect any papers, medical records, official documents or other proof that you fall into one of these categories.
    url: https://medicaid.ncdhhs.gov/beneficiaries/impact-hr-1-and-federal-changes-medicaid/work-and-community-engagement-requirement
    read: '2026-11-20'
    follow_up: This is general advice for all 20 exemption categories on the page, not an instruction about American Indian or Alaska Native status, and it doesn't say the state skips its own records. North Carolina told KFF Health News (13 November 2026) that 3,400 Native enrollees are already verified and will be exempted automatically, which suggests it does use data on file, but no published North Carolina policy says so. We count this as not published, not as a contradiction.
  non_document_proof:
    mark: unpublished
    quote: You may have to provide documents to support your answer.
    url: https://medicaid.ncdhhs.gov/beneficiaries/impact-hr-1-and-federal-changes-medicaid/work-and-community-engagement-requirement
    read: '2026-11-20'
    follow_up: Federal rules let a state ask for documents once its own records fall short. What they bar is denying someone only because documents don't exist. This general sentence covers all 20 exemption categories and says nothing about people without documents, so we count it as not published, not as a contradiction.
