history:
  - date: '2026-11-20'
    from: D
    to: C
    change: The two contradictions rested on general sentences that apply to every exemption category ("Collect any papers ... or other proof", "You may have to provide documents"). Federal rules allow a state to ask for documents; they bar skipping the state's own records and denying someone only because documents don't exist, and North Carolina's page says neither. Check own data first and proof without documents are now not published. North Carolina meets 5 of 10 with no contradictions, which is a C.
    url: https://medicaid.ncdhhs.gov/beneficiaries/impact-hr-1-and-federal-changes-medicaid/work-and-community-engagement-requirement
