history:
  - date: '2026-11-20'
    from: B
    to: B
    change: "New Mexico's proposed rule (8.296.400.10(H)(2) NMAC, noticed August 11, 2026) exempts anyone who is an Indian or urban Indian under the Indian Health Care Improvement Act, a California Indian, or determined eligible as an Indian for Indian Health Service care. That is the full federal definition, so Urban Indians and descendants now meets, IHS-eligible and California Indians now cite the rule's own wording, and Out-of-state tribes meets because the definition has no in-state limit and proof is self-attestation. Check own data first now meets: the tribal notice says HCA uses available data and asks the person only if it cannot. New Mexico meets 9 of 10; the grade stays B because A needs all 10."
    url: https://www.hca.nm.gov/wp-content/uploads/Proposed-8.296.400-NMAC.pdf
