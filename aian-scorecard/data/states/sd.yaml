    change: South Dakota's October 2025 tribal consultation deck says self-attestation of American Indian or Alaska Native status, membership in a federally recognized tribe, or IHS eligibility on an application or renewal form is verification. DSS's April 2026 consultation minutes confirm that people who indicate they are American Indian or Alaska Native need no other documentation. Proof without documents now meets. Because the self-attestation covers members of any federally recognized tribe, out-of-state tribes also meets. South Dakota meets 8 of 10; the grade stays B because an A needs all 10.
