# Evidence re-verified 2026-11-18 against primary sources.
# 2026-11-20 after an outside fact check: DSS's 21 Oct 2025 tribal consultation deck says self-attestation of AI/AN status,
# tribal membership or IHS eligibility is verification; DSS's 21 Apr 2026 consultation minutes confirm no other documentation
# is required. Proof without documents and out-of-state tribes now meet. The deck also reproduces IHCIA 4(13) and (28) as the
# text of H.R. 1, but no DSS document adopts urban Indians or descendants as its own test, so urban stays not published.
